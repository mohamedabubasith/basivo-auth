version: 2
updates:
  # The CLI's own dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "types-*"]

  # This workflow generates projects, so a stale action here means stale CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
